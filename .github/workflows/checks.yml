name: Validate roadmap and C++
on:
  push:
    paths-ignore: ['state/**']
  pull_request:
    paths-ignore: ['state/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/check_cpp.py
