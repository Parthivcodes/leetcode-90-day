name: Daily C++ practice
on:
  schedule:
    - cron: '5 3 * * *' # 08:35 IST primary
    - cron: '5 7 * * *' # 12:35 IST backup
    - cron: '5 13 * * *' # 18:35 IST backup
    - cron: '5 16 * * *' # 21:35 IST backup
    - cron: '5 1 * * *' # 06:35 IST audit of yesterday (never submits)
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, authenticated check, or today's single submission
        type: choice
        options: [preview, preflight, live, audit, notify]
        default: preview
      day:
        description: Day to preview or check (live always uses today's calendar slot)
        type: number
        default: 1
permissions:
  contents: write
  issues: write
concurrency:
  group: leetcode-daily-submission
  cancel-in-progress: false
jobs:
  daily:
    if: github.event.repository.visibility == 'public' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_SUBMISSIONS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run local checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 tests/check_cpp.py
      - name: Daily operation
        if: github.event_name == 'schedule' || inputs.mode != 'notify'
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 1 * * *' && 'audit' || 'live') || inputs.mode }}
          DAY: ${{ inputs.day || 1 }}
          START_DATE: ${{ vars.START_DATE }}
          ENABLE_SUBMISSIONS: ${{ vars.ENABLE_SUBMISSIONS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python3 runner.py --mode "$MODE" --day "$DAY"
      - name: Email acceptance through a GitHub mention (once per UTC day)
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'live' || inputs.mode == 'audit' || inputs.mode == 'notify')
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 1 * * *' && 'audit' || 'live') || inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 notify_acceptance.py
      - name: Failure alert and recovery instructions
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Daily LeetCode operation failed or was not confirmed. Inspect the Daily operation step. Never delete the daily record or retry an uncertain submission."
          echo "## LeetCode daily failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect $RUN_URL. Refresh expired secrets if needed. Backup runs can retry checks before reservation, but never repeat a reserved submission." >> "$GITHUB_STEP_SUMMARY"
